<!DOCTYPE html>

<meta name="description" content="Client records, lash maps, patch tests and before/after photos for the studio. Works offline.">
<meta name="theme-color" content="#140F16">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shanikwanne">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<div class="app">
  <header class="topbar" id="topbar"></header>
  <main class="screen" id="screen" tabindex="-1"></main>
</div>

<nav class="nav" id="nav" aria-label="Main"></nav>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="sheet-root"></div>

<!-- lock screen (optional PIN) -->
<div class="scrim hide" id="lockscreen" style="align-items:center">
  <div class="card" style="width:min(340px,86vw);text-align:center">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:38px;height:38px;color:var(--primary);stroke-width:1.5"><use href="#i-lock"/></svg>
    <h2 style="margin:12px 0 4px">Studio locked</h2>
    <p style="font-size:.875rem;color:var(--muted)">Client health records are protected.</p>
    <label for="pin-input" style="position:absolute;left:-9999px">PIN</label>
    <input id="pin-input" type="number" inputmode="numeric" autocomplete="off" pattern="[0-9]*"
           placeholder="••••" style="text-align:center;font-size:1.5rem;letter-spacing:.4em;margin-bottom:12px">
    <p id="pin-err" class="hide" style="color:var(--danger);font-size:.75rem;font-weight:600" role="alert"></p>
    <button class="btn btn-primary btn-block" id="pin-go">Unlock</button>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/lashmap.js"></script>
<script src="js/photos.js"></script>
<script src="js/app.js"></script>
<script src="js/screens.js"></script>
<script src="js/sessions.js"></script>
<script src="js/settings.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('SW registration failed', e);
    });
  });
}
</script>
</body>
</html>
